name: Skill metadata

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install metadata validator dependency
        run: python -m pip install -r scripts/requirements-metadata.txt
      - name: Test validator
        run: python -m unittest discover -s tests -p 'test_skill_metadata.py' -v
      - name: Validate all skills
        run: python scripts/validate_skill_metadata.py
